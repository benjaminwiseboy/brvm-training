# Déploiement des migrations Supabase (supabase/migrations/**).
#
#   push develop  → environnement GitHub « dev »        → projet Supabase DEV
#   push main     → environnement GitHub « production » → projet Supabase PROD
#
# Garde-fous :
# - chaque environnement GitHub porte ses propres secrets (SUPABASE_PROJECT_REF,
#   SUPABASE_DB_PASSWORD) : impossible de pousser une migration dev en prod ;
# - « production » exige une approbation manuelle (Required reviewers) ;
# - la prod reste DÉSACTIVÉE tant que la variable de dépôt
#   PROD_MIGRATIONS_ENABLED n'est pas à "true" — à n'activer qu'après avoir
#   vérifié l'historique (`supabase migration list`, cf. docs/ENVIRONMENTS.md §4).
#
# Règle de conception (docs/WORKFLOW.md) : une migration doit rester
# compatible avec le code ACTUELLEMENT en prod (expand → déployer → contract),
# car Vercel et ce workflow démarrent en même temps.
name: Migrations Supabase

on:
  push:
    branches: [develop, main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Environnement cible
        type: choice
        options: [dev, production]
        default: dev

concurrency:
  group: db-migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref_name == 'main' && 'production') || 'dev' }}
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev') ||
      (github.event_name == 'push' && github.ref_name == 'develop') ||
      vars.PROD_MIGRATIONS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.4.0
      # Secrets passés étape par étape : l'action tierce setup-cli ne les voit jamais.
      - name: Lien au projet
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: État de l'historique avant migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Simulation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Application
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ${{ job.status == 'success' && '🔵' || '🔴' }} <b>[DB] Migrations ${{ job.status == 'success' && 'appliquées' || 'EN ÉCHEC' }} — ${{ (github.ref_name == 'main' && 'production') || 'dev' }}</b>
            • commit : <code>${{ github.sha }}</code>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">Voir le run</a>
